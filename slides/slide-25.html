<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>One More Thing</title>
<style>
:root{--g:#2af598;--b:#009efd;--ease:cubic-bezier(.16,1,.3,1)}*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.slide{position:fixed;left:50%;top:50%;width:1920px;height:1080px;transform:translate(-50%,-50%);transform-origin:center;overflow:hidden;background:#000}.aurora{position:absolute;left:50%;top:52%;width:900px;height:560px;transform:translate(-50%,-50%);background:radial-gradient(ellipse,rgba(42,245,152,.13),rgba(0,158,253,.08) 35%,transparent 70%);filter:blur(34px);opacity:0;animation:glow 2.4s ease .3s forwards}.line{position:absolute;left:50%;top:59%;width:0;height:2px;transform:translate(-50%,-50%);background:linear-gradient(90deg,transparent,var(--g),var(--b),transparent);box-shadow:0 0 25px rgba(42,245,152,.7);animation:line 1.2s var(--ease) .15s forwards}.copy{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center}.copy h1{font-size:116px;line-height:1;letter-spacing:-.06em;font-weight:760;opacity:0;transform:translateY(18px);filter:blur(10px);animation:enter 1s var(--ease) .6s forwards}.copy h1 span{background:linear-gradient(90deg,var(--g),var(--b));-webkit-background-clip:text;color:transparent}.brand{position:absolute;right:32px;bottom:22px;height:23px;opacity:.5}@keyframes line{to{width:1260px}}@keyframes glow{to{opacity:1}}@keyframes enter{to{opacity:1;transform:none;filter:none}}
</style></head><body><main class="slide" id="slide-container"><div class="aurora"></div><div class="line"></div><section class="copy"><h1>One More <span>Thing.</span></h1></section><img class="brand" src="../assets/Branding__streamax.png" alt="Streamax"></main><script>function fit(){const e=document.getElementById('slide-container'),s=Math.min(innerWidth/1920,innerHeight/1080);e.style.transform=`translate(-50%,-50%) scale(${s})`}addEventListener('resize',fit);fit();</script><script src="shared-compliance-footer.js"></script></body></html>
