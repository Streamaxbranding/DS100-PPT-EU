<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tres preguntas</title>
  <style>
    :root{--green:#2af598;--blue:#009efd;--ease:cubic-bezier(.16,1,.3,1)}
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .slide{position:fixed;left:50%;top:50%;width:1920px;height:1080px;transform:translate(-50%,-50%);transform-origin:center;overflow:hidden;background:#04070d}
    .aurora{position:absolute;inset:-20%;background:radial-gradient(circle at 8% 52%,rgba(42,245,152,.13),transparent 30%),radial-gradient(circle at 92% 48%,rgba(0,158,253,.14),transparent 32%);filter:blur(28px);animation:breathe 7s ease-in-out infinite alternate}
    .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:60px 60px;mask-image:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent)}
    .questions{position:absolute;inset:120px 150px;display:grid;grid-template-rows:repeat(3,1fr);gap:28px;align-content:center}
    .question{position:relative;display:flex;align-items:center;min-height:240px;padding:38px 42px 38px 114px;border:1px solid rgba(255,255,255,.09);border-radius:34px;background:linear-gradient(110deg,rgba(255,255,255,.052),rgba(255,255,255,.018));box-shadow:0 28px 70px rgba(0,0,0,.34),inset 0 1px 0 rgba(255,255,255,.055);opacity:0;transform:translateY(42px) scale(.975);filter:blur(9px);animation:popup .95s var(--ease) forwards}
    .question:nth-child(1){animation-delay:.18s}.question:nth-child(2){animation-delay:.62s}.question:nth-child(3){animation-delay:1.06s}
    .question:before{content:"";position:absolute;left:52px;width:18px;height:18px;border-radius:50%;background:linear-gradient(135deg,var(--green),var(--blue));box-shadow:0 0 24px rgba(42,245,152,.5)}
    .question:after{content:"";position:absolute;left:52px;right:52px;bottom:0;height:1px;background:linear-gradient(90deg,transparent,rgba(42,245,152,.44),rgba(0,158,253,.35),transparent);transform:scaleX(0);animation:line .8s var(--ease) forwards}
    .question:nth-child(1):after{animation-delay:.62s}.question:nth-child(2):after{animation-delay:1.06s}.question:nth-child(3):after{animation-delay:1.5s}
    .question h1{font-size:52px;line-height:1.12;letter-spacing:-.036em;font-weight:760;text-wrap:wrap}
    .question em{font-style:normal;background:linear-gradient(90deg,var(--green),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
    @keyframes popup{to{opacity:1;transform:none;filter:blur(0)}}
    @keyframes line{to{transform:scaleX(1)}}
    @keyframes breathe{to{transform:scale(1.08) translateY(-2%)}}
    @media(prefers-reduced-motion:reduce){*{animation-duration:.001s!important;animation-delay:0s!important;animation-iteration-count:1!important}}
  </style>
</head>
<body>
  <main class="slide" id="slide-container">
    <div class="aurora"></div><div class="grid"></div>
    <section class="questions" aria-label="Fleet safety questions">
      <article class="question"><h1>Can the fleet know <em>when an incident happens</em>——and reconstruct it with <em> usable evidence?</em></h1></article>
      <article class="question"><h1>Can video be deployed with <em>GDPR</em> ——conscious privacy controls?</h1></article>
      <article class="question"><h1>Can <em>DS100</em> meet essential safety needs today——and then adapt to different <em>road-facing</em> priorities?</h1></article>
    </section>
  </main>
  <script>function fit(){const e=document.getElementById('slide-container'),s=Math.min(innerWidth/1920,innerHeight/1080);e.style.transform=`translate(-50%,-50%) scale(${s})`}addEventListener('resize',fit);fit();</script>
<script src="shared-compliance-footer.js"></script></body>
</html>
