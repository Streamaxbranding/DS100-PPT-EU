<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DS100 — Thank You &amp; Q&amp;A</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--ease:cubic-bezier(.22,1,.36,1);}
html,body{width:100%;height:100%;overflow:hidden;background:#020507;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;}
.scene{
  position:fixed;left:50%;top:50%;width:1920px;height:1080px;
  transform:translate(-50%,-50%) scale(1);transform-origin:center;
  overflow:hidden;
  background:
    radial-gradient(ellipse 66% 48% at 50% -10%,rgba(24,226,151,.13) 0%,rgba(6,84,94,.07) 42%,transparent 72%),
    radial-gradient(ellipse 48% 40% at 76% 4%,rgba(0,137,255,.11) 0%,transparent 70%),
    linear-gradient(180deg,#030709 0%,#020507 62%,#010304 100%);
  color:#fff;user-select:none;
}
.aurora{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
.aurora::before{
  content:'';position:absolute;left:50%;top:-350px;width:1240px;height:570px;border-radius:50%;
  background:linear-gradient(110deg,rgba(42,255,145,.72) 0%,rgba(17,218,203,.56) 52%,rgba(0,140,255,.66) 100%);
  filter:blur(120px);opacity:.2;transform:translate3d(-50%,0,0);
  animation:aurora-drift 16s ease-in-out infinite alternate;
}
.aurora::after{
  content:'';position:absolute;left:50%;top:230px;width:1180px;height:1px;transform:translateX(-50%);
  background:linear-gradient(90deg,transparent,rgba(41,239,173,.16),rgba(0,153,255,.12),transparent);
  box-shadow:0 0 90px 22px rgba(9,169,177,.045);
}
.logo{position:absolute;left:50%;top:58px;z-index:2;transform:translate3d(-50%,12px,0);opacity:0;transition:opacity .8s var(--ease),transform .8s var(--ease);}
.logo img{display:block;width:218px;height:auto;opacity:.74;filter:drop-shadow(0 10px 28px rgba(0,0,0,.48));}
.content{
  position:absolute;left:0;right:0;top:49%;z-index:2;transform:translateY(-50%);
  display:flex;flex-direction:column;align-items:center;text-align:center;
}
.thank-you{
  font-size:176px;line-height:.9;font-weight:790;letter-spacing:-.072em;color:#fff;
  text-shadow:0 22px 70px rgba(0,0,0,.38);
  opacity:0;filter:blur(8px);transform:translate3d(0,22px,0) scale(.99);
  transition:opacity .95s var(--ease),filter .95s var(--ease),transform .95s var(--ease);
}
.qa{
  display:inline-block;width:max-content;margin-top:38px;
  font-size:112px;line-height:.9;font-weight:760;letter-spacing:-.052em;
  color:#2aff91;background:linear-gradient(96deg,#2aff91 0%,#18dfca 48%,#008cff 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  opacity:0;filter:blur(7px);transform:translate3d(0,20px,0);
  transition:opacity .9s var(--ease),filter .9s var(--ease),transform .9s var(--ease);
}
.scene.ready .logo{opacity:1;transform:translate3d(-50%,0,0);transition-delay:.05s;}
.scene.ready .thank-you{opacity:1;filter:blur(0);transform:translate3d(0,0,0) scale(1);transition-delay:.16s;}
.scene.ready .qa{opacity:1;filter:blur(0);transform:translate3d(0,0,0) scale(1);transition-delay:.28s;}
@keyframes aurora-drift{from{transform:translate3d(-52%,0,0) scale(.98);}to{transform:translate3d(-48%,20px,0) scale(1.04);}}
@media (prefers-reduced-motion:reduce){.aurora::before{animation:none;}.logo,.thank-you,.qa{transition-duration:0s;}}

/* MeetDeck Aurora contract and import hardening. */
:root{
  --bg-deep:#050810;--bg-gradient:radial-gradient(circle at 50% 40%,#0f1c30 0%,#050810 90%);
  --primary-green:#2AF598;--secondary-blue:#009EFD;--accent-amber:#FFC857;
  --text-white:#FFFFFF;--text-grey:#A0AEC0;--glass-bg:rgba(255,255,255,0.03);
  --glass-border:1px solid rgba(255,255,255,0.08);--card-bg:#0B1221;--card-radius:16px;
  --font-main:'Inter',sans-serif;--font-mono:'JetBrains Mono',monospace;
  --glow-shadow:0 0 20px rgba(42,245,152,0.15);
  --anim-entrance:cubic-bezier(0.2,0.8,0.2,1);--ease-apple:cubic-bezier(0.25,0.1,0.25,1);
}
html,body{margin:0!important;padding:0!important;width:100%!important;height:100%!important;background:#050810!important;overflow:hidden!important;}
#slide-container{width:1920px!important;height:1080px!important;position:absolute!important;top:50%!important;left:50%!important;transform-origin:center center!important;overflow:hidden!important;color:#fff;}
#slide-container,#slide-container *{font-family:'Inter','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;overflow-wrap:anywhere;}
#slide-container [class*="col"],#slide-container [class*="card"]{min-width:0;}
#slide-container .img-placeholder{display:flex;align-items:center;justify-content:center;background:var(--glass-bg);border:1px dashed rgba(255,255,255,0.15);border-radius:12px;color:var(--text-grey);font-size:0.9rem;}
#slide-container .__streamax-wm-host{position:absolute!important;bottom:22px!important;right:28px!important;display:flex!important;align-items:center!important;padding:6px 14px!important;background:rgba(0,0,0,0.45)!important;backdrop-filter:blur(10px)!important;-webkit-backdrop-filter:blur(10px)!important;border-radius:9999px!important;z-index:9999!important;pointer-events:none!important;user-select:none!important;border:1px solid rgba(255,255,255,0.08)!important;}
#slide-container .__streamax-wm{height:24px!important;width:auto!important;max-width:240px!important;display:block!important;opacity:0.95!important;}

#slide-container .__streamax-wm-host{display:none!important;}
#slide-container .custom-title-logo{display:block;width:190px;height:auto;margin:0 0 18px 0;opacity:.82;filter:drop-shadow(0 8px 24px rgba(0,0,0,.48));}
#slide-container .custom-reliability-logo{display:block;width:190px;height:auto;margin:0 0 14px 0;opacity:.78;filter:drop-shadow(0 8px 24px rgba(0,0,0,.48));}
#slide-container .custom-launch-logo{display:block;width:190px;height:auto;margin:0 0 18px 0;opacity:.82;filter:drop-shadow(0 8px 24px rgba(0,0,0,.48));}

</style>

<main class="scene" id="scene">
  <div class="aurora" aria-hidden="true"></div>

  <div class="logo"><img src="../assets/Branding__streamax.png" alt="Streamax" data-slot="media-16-1"></div>

  <section class="content" aria-labelledby="qa-title">
    <div class="thank-you">Questions? Let's Talk.</div>
    <h1 class="qa" id="qa-title">Q&amp;A&nbsp</h1>
  </section>

</main>


</div>

function rescale(){

  scene.style.transform=`translate(-50%,-50%) scale(${scale})`;
}
window.addEventListener('resize',rescale);
rescale();
requestAnimationFrame(()=>scene.classList.add('ready'));
</script>
