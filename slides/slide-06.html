<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Meet DS100</title>
  <style>
    :root{--ease:cubic-bezier(.16,1,.3,1)}
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .slide{position:fixed;left:50%;top:50%;width:1920px;height:1080px;transform:translate(-50%,-50%);transform-origin:center;overflow:hidden;display:grid;place-items:center;background:radial-gradient(circle at 50% 50%,rgba(12,35,53,.58),transparent 44%),#04070d}
    .glow{position:absolute;width:950px;height:370px;border-radius:50%;background:radial-gradient(ellipse,rgba(42,245,152,.13),rgba(0,158,253,.07) 40%,transparent 72%);filter:blur(42px);opacity:0;animation:glow 2.2s var(--ease) .15s forwards}
    h1{position:relative;font-size:152px;line-height:1;letter-spacing:-.07em;padding:0.08em;font-weight:880;background:linear-gradient(94deg,#fff 3%,#e9fff7 28%,#2af598 54%,#009efd 96%);background-size:160% 100%;background-position:100% 0;-webkit-background-clip:text;background-clip:text;color:transparent;opacity:0;filter:blur(22px);transform:translateY(32px) scale(.975);animation:focus 1.45s var(--ease) .22s forwards,shimmer 7s ease-in-out 1.7s infinite alternate}
    h1:after{content:"";position:absolute;left:3%;right:2%;bottom:-35px;height:2px;background:linear-gradient(90deg,transparent,rgba(42,245,152,.58),rgba(0,158,253,.48),transparent);transform:scaleX(0);opacity:0;animation:line 1.2s var(--ease) 1s forwards}
    @keyframes focus{to{opacity:1;filter:blur(0);transform:none}}@keyframes line{to{opacity:1;transform:scaleX(1)}}@keyframes glow{to{opacity:1;transform:scale(1.08)}}@keyframes shimmer{to{background-position:0 0}}
    @media(prefers-reduced-motion:reduce){*{animation-duration:.001s!important;animation-delay:0s!important;animation-iteration-count:1!important}}
  </style>
</head>
<body>
  <main class="slide" id="slide-container"><div class="glow"></div><h1>Meet DS100</h1></main>
  <script>function fit(){const e=document.getElementById('slide-container'),s=Math.min(innerWidth/1920,innerHeight/1080);e.style.transform=`translate(-50%,-50%) scale(${s})`}addEventListener('resize',fit);fit();</script>
<script src="shared-compliance-footer.js"></script></body>
</html>
