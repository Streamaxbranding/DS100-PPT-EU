<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>What if you want more?</title>
<style>
:root{--g:#2af598;--b:#009efd;--ease:cubic-bezier(.16,1,.3,1)}*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.slide{position:fixed;left:50%;top:50%;width:1920px;height:1080px;transform:translate(-50%,-50%);transform-origin:center;overflow:hidden;background:#03060b}.slide:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 72% 50%,rgba(0,158,253,.16),transparent 30%),radial-gradient(circle at 28% 50%,rgba(42,245,152,.1),transparent 33%)}.product{position:absolute;right:-10px;top:115px;width:980px;height:760px;object-fit:contain;opacity:.16;filter:grayscale(1) contrast(1.4) drop-shadow(0 0 60px rgba(0,158,253,.25));animation:ghost 5s ease-in-out infinite}.line{position:absolute;left:95px;top:205px;width:4px;height:0;background:linear-gradient(var(--g),var(--b));box-shadow:0 0 24px rgba(42,245,152,.5);animation:line 1s var(--ease) .15s forwards}.copy{position:absolute;z-index:3;left:145px;top:215px;width:1250px}.eyebrow{font-size:15px;letter-spacing:.34em;text-transform:uppercase;color:#8fa1b7;font-weight:750;opacity:0;animation:up .7s var(--ease) .18s forwards}.title{font-size:112px;line-height:1.03;letter-spacing:-.06em;font-weight:850;margin-top:38px;opacity:0;animation:up .85s var(--ease) .32s forwards}.title span{background:linear-gradient(90deg,var(--g),var(--b));-webkit-background-clip:text;color:transparent}.sub{font-size:31px;line-height:1.35;color:#9ba9bb;margin-top:42px;opacity:0;animation:up .8s var(--ease) .55s forwards}.brand{position:absolute;right:32px;bottom:22px;height:23px;opacity:.55}@keyframes line{to{height:520px}}@keyframes up{from{opacity:0;transform:translateY(25px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}@keyframes ghost{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
</style></head><body><main class="slide" id="slide-container"><img class="product" src="../assets/Dashcam Images__DS100.png" alt="DS100"><div class="line"></div><section class="copy"><div class="eyebrow">Coverage Sets the Baseline</div><h1 class="title">What if you<br>need<span> more?</span></h1><p class="sub">More forward detail.<br> More prevention.<br>More intelligence before the impact.</p></section><img class="brand" src="../assets/Branding__streamax.png" alt="Streamax"></main><script>function fit(){const e=document.getElementById('slide-container'),s=Math.min(innerWidth/1920,innerHeight/1080);e.style.transform=`translate(-50%,-50%) scale(${s})`}addEventListener('resize',fit);fit();</script><script src="shared-compliance-footer.js"></script></body></html>
